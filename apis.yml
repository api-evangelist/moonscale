x-contract-discovery:
  note: >-
    A prior enrichment pass (2026-07-20) recorded that Moonscale "publishes no public API,
    SDK, developer portal, or OpenAPI surface". That was wrong, and the reason it was wrong
    is worth recording. Nothing on moonscale.com links to the API: the marketing site is a
    Webflow build whose complete sitemap has no developer, docs, API or pricing URL, and
    every /openapi.json, /docs, /api and /developers path 404s. The contract was found by
    following the company's own blog posts to its pre-rename identity (VidLab7), then to the
    npm registry, where the third-party Activepieces connector @activepieces/piece-vidlab7
    hard-codes the real API host and the x-api-key scheme. Searching from that host surfaced
    the Mintlify documentation site, which serves a genuine OpenAPI 3.0.1 titled
    "Moonscale API" at /api-reference/openapi.json along with a real llms.txt.
  ownership_check:
    verdict: confirmed
    reasoning: >-
      The spec is served from a mintlify.app subdomain rather than a moonscale.com host, so
      it was checked against what it says about itself rather than where it was fetched. Its
      info.title is "Moonscale API" and its description names Moonscale. Its four paths
      (/api/v1/conversations/{conversationShortCode}, /api/v1/rooms,
      /api/studio-avatar/generate-video, /api/studio-avatar/generated-video/{correlationId})
      and its x-api-key security scheme match, exactly, the live endpoints the independent
      third-party Activepieces connector calls against api-prd.vidlab7.com — and both
      api-prd.moonscale.com and api-prd.vidlab7.com resolve, are live, and answer with the
      same Moonscale error envelope. The vidlab7 domain is the company's own pre-rename
      identity, corroborated by Crunchbase filing Moonscale under /organization/vidlab7 and
      by Moonscale's own blog posts about VidLab7. The spec's servers[] block
      (http://sandbox.mintlify.com) is the only element that does NOT point at the provider,
      and that is a Mintlify template default rather than a sibling product's host.
  probes:
  - {url: 'https://www.moonscale.com/openapi.json', status: 404}
  - {url: 'https://www.moonscale.com/docs', status: 404}
  - {url: 'https://www.moonscale.com/developers', status: 404}
  - {url: 'https://www.moonscale.com/llms.txt', status: 404}
  - {url: 'https://app.moonscale.com/openapi.json', status: 404}
  - {url: 'https://api-prd.moonscale.com/openapi.json', status: 403}
  - {url: 'https://api-prd.moonscale.com/health', status: 401}
  - {url: 'https://vidlab7-d7584a5d.mintlify.app/api-reference/openapi.json', status: 200}
  - {url: 'https://vidlab7-d7584a5d.mintlify.app/llms.txt', status: 200}
  robots:
    honored: true
    note: >-
      api-prd.moonscale.com, app.moonscale.com and studio.vidlab7.com all serve
      "User-agent: * / Disallow: /" and additionally name GPTBot, ChatGPT-User and CCBot.
      Probing of those hosts stopped at the initial discovery sweep. The documentation host
      allows crawling and carries "Content-Signal: ai-train=yes, search=yes, ai-input=yes".
