apis:
- name: Moonscale API
  description: >-
    The Moonscale API covers two surfaces. The live-avatar surface creates single-participant
    meeting rooms hosted by a real-time AI sales avatar and returns the conversation transcript
    plus an AI-generated summary afterwards, keyed either by a single conversation handle or by a
    time window of at most 24 hours. The studio-avatar surface renders videos asynchronously from
    a script, a voice and an avatar, returning a caller-supplied correlation id that is then used
    to poll for the result or to match an optional completion webhook. All requests authenticate
    with an x-api-key header.
  humanURL: https://vidlab7-d7584a5d.mintlify.app/api-reference/introduction
  baseURL: https://api-prd.moonscale.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/moonscale.png
  tags:
  - Artificial Intelligence
  - Sales
  - Conversational AI
  - Video Generation
  - Avatars
  - Webhooks
