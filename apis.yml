    url: asyncapi/moonscale-webhooks.yml
  - type: RateLimits
    url: rate-limits/moonscale-rate-limits.yml
  x-base-url-note: >-
    The published OpenAPI's servers[] block is http://sandbox.mintlify.com — the Mintlify
    documentation-template default, on a host Moonscale does not own. The real base URL is
    https://api-prd.moonscale.com, named throughout Moonscale's own reference and verified
    live on 2026-08-14 (HTTP 401 with a Moonscale error envelope on /health). The pre-rename
    host https://api-prd.vidlab7.com is also still live and is the host the third-party
    Activepieces connector still targets. The harvested spec is left verbatim; the correction
    is carried in overlays/moonscale-api-overlay.yaml.
