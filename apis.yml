name: Moonscale
description: 'Moonscale is an AI sales advisor platform that automates top-of-funnel sales conversations
  and lead qualification with AI-powered sales avatars. Its avatars pitch products, qualify inbound
  buyers, handle objections, book meetings, and follow up around the clock across websites, landing
  pages, emails, and apps, with support for 130+ languages and CRM connections to Salesforce, HubSpot,
  Pipedrive, Slack, and Clay. Moonscale markets a no-code, "no dev work required" deployment and, as of
  this enrichment pass, publishes no public API, SDK, developer portal, or OpenAPI surface. Backed by
  EQT Ventures. Added to the API Evangelist network as a portfolio company profile.'
