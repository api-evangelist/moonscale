name: Moonscale
description: 'Moonscale (formerly VidLab7) is a Munich-based AI sales advisor platform whose
  "Digital Sales Human" avatars automate top-of-funnel sales conversations — pitching products,
  qualifying inbound buyers, running interactive demos, handling objections, booking meetings and
  following up around the clock across websites, landing pages, emails and apps, with support for
  130+ languages and CRM connections to Salesforce, HubSpot, Pipedrive, Slack and Clay. Moonscale
  does publish a real, machine-readable API: an OpenAPI 3.0.1 document titled "Moonscale API" served
  from its Mintlify documentation site, covering four operations across two surfaces — live-avatar
  meeting rooms with conversation transcripts and summaries (/api/v1/), and asynchronous
  studio-avatar video generation with a caller-registered completion webhook (/api/studio-avatar/).
  Requests authenticate with an x-api-key header against https://api-prd.moonscale.com; keys are
  issued from Moonscale Studio, but API access is feature-flagged per account and must be requested
  from support. There is no first-party SDK, MCP server, agent card, status page, changelog,
  published rate limit or published price. Backed by EQT Ventures.'
