                "conversationId": "uuid",
                "startTimestamp": "2024-01-01T00:00:00.000Z",
                "durationSeconds": 120,
                "utm_id": "contact-id",
                "utm_source": "source",
                "transcript": [
                    {
                        "role": "assistant",
                        "type": "type",
                        "text": "text",
                        "timestamp": "2024-01-01T00:00:00.000Z"
                    }
