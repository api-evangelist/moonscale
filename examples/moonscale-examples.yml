- operation: 'POST /api/v1/rooms'
  title: Create a live meeting room
  source: https://vidlab7-d7584a5d.mintlify.app/api-reference/endpoint/liveAvatarsCreateRoom
  request: |
    curl --location --request POST 'https://api-prd.moonscale.com/api/v1/rooms' \
    --header 'Content-Type: application/json' \
    --header 'x-api-key: <YOUR_API_KEY>' \
    --data-raw '{
        "name": "room-name",
        "liveAvatarId": "avatar-uuid",
        "conversationShortCode": "conversation-shortcode",
        "contactEmail": "name@example.com",
        "privacy": "private",
        "enableChat": true,
        "roomSettings": { "shouldBotJoinImmediately": false },
        "context": "context"
    }'
  response_201: |
    {
        "url": "https://your-daily-room-url",
        "conversationId": "conversation-id"
    }
  defect_note: >-
    The example body as published on the documentation page is not valid JSON — it wraps the
    object in a second pair of braces and omits commas after "conversation-shortcode" and
    "name@example.com". The body above is the same example with those syntax errors
    corrected so it parses; no field name or value has been changed, added or removed.
- operation: 'GET /api/v1/conversations/{conversationId}'
  title: Get a single meeting transcript and summary
  source: https://vidlab7-d7584a5d.mintlify.app/api-reference/endpoint/liveAvatarsGetTranscript
  request: |
    curl --location --request GET 'https://api-prd.moonscale.com/api/v1/conversations/{conversationId}' \
    --header 'Content-Type: application/json' \
    --header 'x-api-key: <YOUR_API_KEY>'
  response_200: |
    {
        "transcript": [
            {
                "role": "assistant",
                "type": "type",
                "text": "text",
                "timestamp": "date-time-timestamp"
            }
        ],
        "summary": "summary"
    }
- operation: 'GET /api/v1/conversations'
  title: List conversations in a time window
  source: https://vidlab7-d7584a5d.mintlify.app/api-reference/endpoint/liveAvatarsGetConversationsByDate
  request: |
    curl --location --request GET 'https://api-prd.moonscale.com/api/v1/conversations?dateStart=1700000000&dateEnd=1700086400' \
